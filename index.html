<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f7f3">
    <meta name="description" content="고민은 룰렛에게 맡기고, 오늘의 선택을 가볍게 정해보세요.">
    <title>돌려돌려 — 오늘의 선택 룰렛</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="돌려돌려 홈">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>돌려돌려</span>
        </a>
        <span class="topbar-note"><span class="status-dot"></span> 고민은 잠시 맡겨두세요</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span>✦</span> A LITTLE SPIN, A CLEAR MIND</p>
        <h1 id="page-title">오늘의 선택,<br><span>운명에 맡겨볼까요?</span></h1>
        <p class="intro-copy">결정하기 어려운 순간, 후보를 적고 룰렛을 돌려보세요.<br class="desktop-break"> 생각보다 마음이 편해질지도 몰라요.</p>
      </section>

      <section class="workspace" aria-label="룰렛">
        <aside class="choice-card" aria-labelledby="choices-title">
          <div class="card-heading">
            <div>
              <p class="section-kicker">YOUR OPTIONS</p>
              <h2 id="choices-title">후보를 정해주세요</h2>
            </div>
            <span class="count-badge" id="candidate-count">6개</span>
          </div>

          <div class="preset-row" aria-label="기본 프리셋">
            <button class="preset-button" type="button" data-preset="lunch">🍽️ 점심 메뉴</button>
            <button class="preset-button" type="button" data-preset="penalty">🎭 벌칙</button>
            <button class="preset-button" type="button" data-preset="weekend">🌿 주말 계획</button>
          </div>

          <form class="preset-save-form" id="preset-save-form">
            <label class="sr-only" for="preset-name-input">저장할 프리셋 이름</label>
            <input id="preset-name-input" name="preset-name" type="text" maxlength="20" placeholder="현재 후보를 프리셋으로 저장" autocomplete="off">
            <button type="submit">저장</button>
          </form>
          <p class="preset-status" id="preset-status" role="status" aria-live="polite"></p>

          <section class="saved-presets" id="saved-presets" aria-label="내 프리셋" hidden>
            <p class="saved-presets-label">내 프리셋</p>
            <div class="saved-preset-list" id="saved-preset-list"></div>
          </section>

          <form class="add-form" id="add-form">
            <label class="sr-only" for="candidate-input">새 후보 입력</label>
            <input id="candidate-input" name="candidate" type="text" maxlength="24" placeholder="새로운 후보를 입력하세요" autocomplete="off">
            <button class="add-button" type="submit" aria-label="후보 추가">+</button>
          </form>

          <ul class="candidate-list" id="candidate-list" aria-label="룰렛 후보"></ul>
          <p class="helper-text" id="helper-text">후보는 2개 이상, 최대 12개까지 추가할 수 있어요.</p>
        </aside>

        <section class="wheel-panel" aria-label="룰렛 돌리기">
          <div class="wheel-stage">
            <img class="wheel-art" src="assets/roulette-wheel.png" alt="" aria-hidden="true" width="626" height="626">
            <div class="pointer" aria-hidden="true"><span></span></div>
            <canvas id="wheel" width="720" height="720" aria-label="후보가 표시된 룰렛"></canvas>
          </div>
          <button class="spin-button" id="spin-button" type="button">
            <span class="spin-icon" aria-hidden="true">↻</span>
            <span>룰렛 돌리기</span>
            <span class="button-sparkle" aria-hidden="true">✦</span>
          </button>
          <p class="spin-hint">버튼을 누르면 행운의 선택이 시작돼요</p>
          <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true" hidden>
            <span class="result-label">오늘의 선택은</span>
            <strong id="result-name"></strong>
            <span class="result-confetti" aria-hidden="true">✦</span>
          </div>
        </section>
      </section>

      <footer class="footer">
        <span>모든 후보는 같은 확률로 선택돼요.</span>
        <span class="footer-heart" aria-hidden="true">♥</span>
        <span>가끔은 우연이 정답이니까요.</span>
      </footer>
    </main>
  </body>
</html>
